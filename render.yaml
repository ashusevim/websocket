# Render blueprint — full-stack WebSocket chat.
#
# WHAT THIS CREATES. One repo, one push, one Blueprint -> three resources:
#
#   websocket-chat-server   web service. Builds server/Dockerfile. Serves the
#                           REST API and the WebSocket. This is the backend.
#   websocket-chat-client   static site. Publishes ./client to a CDN. This is
#                           the frontend. No build step.
#   websocket-chat-db       Postgres. Only reachable from inside Render.
#
# They are DEPLOYED together (one blueprint, from one repo, no manual upload of
# either half) but they RUN separately, because they scale differently, ship
# differently, and must not be able to reach each other's internals.
#
# DEPLOY: merge to main, then Render -> New + -> Blueprint -> connect this
# repo -> select the main branch -> Apply. Nothing else to upload.

services:
  # --- API + WebSocket server -------------------------------------------
  - type: web
    name: websocket-chat-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    # Free instances sleep after inactivity and are restarted roughly monthly,
    # which is why ALLOWED_ORIGINS and the client's server URL are configuration
    # rather than hardcoded values.
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT and routes traffic to whatever the process listens
      # on. The server reads PORT from the environment and defaults to 8080.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: websocket-chat-db
          property: connectionString
      # Must list the client's exact origin. A ws:// or wss:// entry is wrong
      # here: the Origin header is always http/https, even on a wss connection.
      # Replace with your real client URL after the first deploy.
      - key: ALLOWED_ORIGINS
        sync: false

  # --- Static client ----------------------------------------------------
  - type: web
    name: websocket-chat-client
    runtime: static
    staticPublishPath: ./client
    buildCommand: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      # The client loads no third-party scripts or styles, so the policy can
      # stay tight. 'unsafe-inline' covers the inline <style>/<script> in
      # index.html; frame-ancestors 'none' blocks clickjacking.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          connect-src 'self' https: wss:;
          img-src 'self' data:;
          base-uri 'none';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

# Databases have no `type` field. `type` belongs to the `services` list above
# (web/pserv/worker/cron/keyvalue/workflow); a Postgres instance is identified
# by being in this list and by its `name`. Adding `type: db` here makes Render
# reject the whole Blueprint as soon as it is applied.
databases:
  - name: websocket-chat-db
    plan: free
    # Empty allowlist means no external connections: only services inside this
    # Render account can reach the database.
    ipAllowList: []
    postgresMajorVersion: "16"

# SCHEMA
# -------
# No manual step. The server applies server/schema.sql itself on boot, before it
# accepts traffic (src/db.ts -> applySchema()). Every statement is IF NOT
# EXISTS, so it is safe on every restart and safe to run concurrently.
#
# Set AUTO_MIGRATE=false on the web service if you would rather manage the
# schema by hand.
#
# ALLOWED_ORIGINS
# ---------------
# Must be the client's exact origin, e.g. https://chat.ashusevim.dev
#   - no trailing slash
#   - no ws:// or wss:// (the Origin header is http/https even on wss)
# A wrong value here fails as a 403 on the WebSocket connect, which looks
# nothing like a CORS error.
#
# On first deploy you do not know the client URL yet. Put any valid value,
# confirm both services are live, then come back and set the real one.
