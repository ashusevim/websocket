<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Chat Application</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="login" class="auth-form-container active">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
            </svg>
        </div>
        <h2>Welcome Back</h2>
        
        <div id="login-error" class="error-message">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="login-error-text"></span>
        </div>
        
        <form id="login-form" method="post">
            <div class="input-group">
                <label for="username-input">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="username-input" 
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    minlength="3"
                    maxlength="50"
                />
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        minlength="6"
                    />
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="login-btn">
                Sign In
            </button>
        </form>
        
        <div class="divider">or</div>
        
        <p class="switch-text">
            Don't have an account? <a href="#" id="show-register-link">Create one</a>
        </p>
    </div>

    <div id="register" class="auth-form-container">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
            </svg>
        </div>
        <h2>Create Account</h2>
        
        <div id="register-error" class="error-message">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="register-error-text"></span>
        </div>
        
        <div id="register-success" class="success-message">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Account created successfully! Redirecting to login...</span>
        </div>
        
        <form id="register-form" method="post">
            <div class="input-group">
                <label for="register-username">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    id="register-username" 
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                    minlength="3"
                    maxlength="50"
                    pattern="^[a-zA-Z0-9_]+$"
                />
            </div>
            
            <div class="input-group">
                <label for="register-password">Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="register-password" 
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                        minlength="6"
                        maxlength="128"
                    />
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <span class="input-hint">Minimum 6 characters</span>
            </div>
            
            <button type="submit" class="submit-btn" id="register-btn">
                Create Account
            </button>
        </form>
        
        <div class="divider">or</div>
        
        <p class="switch-text">
            Already have an account? <a href="#" id="show-login-link">Sign in</a>
        </p>
    </div>

    <div id="layout">
        <div class="header">
            <h1>Real Time Chat Application</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="status" aria-live="polite">
                    <span id="connection-status"></span>
                    <span id="status-dot" class="dot"></span>
                    <span id="status-text">Connecting…</span>
                </div>
                <button id="logout">Logout</button>
            </div>
        </div>

        <div id="inner-layout">
            <div id="username">
                <h2>Me</h2>
                <p id="currentUser">Not set</p>
                <h2>Connected users</h2>
                <ul id="userList"></ul>
            </div>

            <form id="chat-form">
                <label for="message-box">Type your message</label>
                <input id="message-box" placeholder="Write a message and press Enter…" type="text" required
                    autocomplete="off" maxlength="250" />
                <button id="send" type="submit" aria-label="Send message">
                    Send
                </button>
            </form>

            <div id="messages-container">
                <span>Messages</span>
                <ul id="messages"></ul>
            </div>
        </div>
    </div>

    <script>
        const loginView = document.querySelector("#login");
        const registerView = document.querySelector("#register");
        const chatView = document.querySelector("#layout");

        const loginForm = document.querySelector('#login-form');
        const registerForm = document.querySelector('#register-form');
        const chatForm = document.querySelector('#chat-form');
        
        const loginError = document.getElementById('login-error');
        const loginErrorText = document.getElementById('login-error-text');
        const registerError = document.getElementById('register-error');
        const registerErrorText = document.getElementById('register-error-text');
        const registerSuccess = document.getElementById('register-success');

        // Password toggle functionality
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const input = button.parentElement.querySelector('input');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                
                // Update icon
                button.innerHTML = isPassword
                    ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                       </svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                       </svg>`;
            });
        });

        function showError(element, textElement, message) {
            textElement.textContent = message;
            element.classList.add('visible');
            element.closest('.auth-form-container').classList.add('shake');
            setTimeout(() => {
                element.closest('.auth-form-container').classList.remove('shake');
            }, 400);
        }

        function hideError(element) {
            element.classList.remove('visible');
        }

        function setButtonLoading(button, loading) {
            if (loading) {
                button.disabled = true;
                button.dataset.originalText = button.textContent;
                button.textContent = 'Please wait...';
            } else {
                button.disabled = false;
                button.textContent = button.dataset.originalText || button.textContent;
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            hideError(loginError);
            const usernameInput = loginForm.querySelector('input[name="username"]');
            const passwordInput = loginForm.querySelector('input[name="password"]');
            const submitBtn = document.getElementById('login-btn');
            setButtonLoading(submitBtn, true);
            Login(usernameInput.value, passwordInput.value).finally(() => {
                setButtonLoading(submitBtn, false);
            });
        });

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            hideError(registerError);
            registerSuccess.classList.remove('visible');
            const usernameInput = registerForm.querySelector('input[name="username"]');
            const passwordInput = registerForm.querySelector('input[name="password"]');
            const submitBtn = document.getElementById('register-btn');
            setButtonLoading(submitBtn, true);
            Register(usernameInput.value, passwordInput.value).finally(() => {
                setButtonLoading(submitBtn, false);
            });
        });

        const showLoginLink = document.getElementById('show-login-link');
        const showRegisterLink = document.getElementById('show-register-link');

        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            hideError(registerError);
            registerSuccess.classList.remove('visible');
            registerView.classList.remove('active');
            registerView.style.display = 'none';
            loginView.classList.add('active');
            loginView.style.display = 'block';
        });

        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            hideError(loginError);
            loginView.classList.remove('active');
            loginView.style.display = 'none';
            registerView.classList.add('active');
            registerView.style.display = 'block';
        });

        let socket;
        // `127.0.0.1` is a local address too — matching only 'localhost' sent
        // local traffic over https/wss to a plain-http server.
        const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];
        const isProduction = !LOCAL_HOSTS.includes(window.location.hostname);
        const wsProtocol = isProduction ? 'wss' : 'ws';
        const apiProtocol = isProduction ? 'https' : 'http';
        const serverHost = isProduction ? 'websocket-chat-server-ptfw.onrender.com' : 'localhost:8080';
        let username = "";
        let token = "";
        let shouldReconnect = true;
        const currentUser = document.getElementById("currentUser");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const userList = document.getElementById("userList");
        const connectionStatus = document.getElementById("connection-status");
        const messageBox = document.getElementById("message-box");
        const sendButton = document.getElementById("send");
        const logout = document.getElementById("logout");

        let reconnectionInterval = 5000;
        let maxReconnectionInterval = 30000;

        /**
         * Trades the JWT for a short-lived, single-use ticket, then connects
         * with the ticket instead of the JWT.
         *
         * The JWT travels in an Authorization header over HTTPS, so it never
         * lands in a URL — and URLs are what access logs, proxies and browser
         * history record. The ticket is worthless if leaked: it expires in
         * seconds and is destroyed on first use.
         */
        async function fetchTicket(jwt) {
            const response = await fetch(`${apiProtocol}://${serverHost}/ws-ticket`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${jwt}`,
                },
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.message || 'Could not authorise connection');
            }

            return (await response.json()).ticket;
        }

        async function connect(token, username) {
            let ticket;
            try {
                ticket = await fetchTicket(token);
            } catch (error) {
                // A rejected ticket means the session is gone (expired or
                // logged out). Retrying would just loop, so stop and surface it.
                console.error('Ticket exchange failed:', error);
                shouldReconnect = false;
                setStatus(false);
                statusText.textContent = 'Session expired';
                return;
            }

            const wsUrl = `${wsProtocol}://${serverHost}?ticket=${encodeURIComponent(ticket)}`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("Connected to the websocket server");
                reconnectionInterval = 5000;
                setStatus(true);
                currentUser.textContent = username;
            };

            socket.onmessage = (event) => {
                const messageList = document.getElementById("messages");
                const msg = JSON.parse(event.data);

                if (msg.type === "userList") {
                    updateUserList(msg.users);
                    return;
                }

                if (msg.type === "announcement") {
                    const li = document.createElement("li");
                    li.classList.add("announcement");
                    li.textContent = msg.message;
                    messageList.appendChild(li);
                    return;
                }

                if (msg.message) {
                    const li = document.createElement("li");
                    if (msg.username === username) {
                        li.classList.add("my-message");
                    }
                    if (msg.username || msg.timestamp) {
                        const meta = document.createElement("span");
                        meta.className = "meta";
                        const who = msg.username ?? "Unknown";
                        const when = msg.timestamp ? ` • ${msg.timestamp}` : "";
                        meta.textContent = `${who}${when}`;
                        li.appendChild(meta);
                    }
                    li.appendChild(document.createTextNode(msg.message));
                    messageList.appendChild(li);
                    messageList.scrollTop = messageList.scrollHeight;
                }
            };

            socket.onerror = (error) => {
                console.log("Error", error);
                setStatus(false);
                statusText.textContent = "Connection error";
            };

            socket.onclose = () => {
                console.log(`Websocket disconnected. Reconnecting in ${reconnectionInterval / 1000}s...`);
                setStatus(false);
                statusText.textContent = 'Reconnecting...';

                if (shouldReconnect) {
                    setTimeout(() => {
                        connect(token, username);
                    }, reconnectionInterval);

                    reconnectionInterval = Math.min(reconnectionInterval * 2, maxReconnectionInterval);
                }
            };
        }

        async function Logout(token) {
            try {
                const response = await fetch(`${apiProtocol}://${serverHost}/logout`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token }),
                });

                if (!response.ok) {
                    throw new Error("Logout Failed");
                }

                shouldReconnect = false;
                if (socket) {
                    socket.close();
                }

                token = "";
                username = "";

                chatView.style.display = 'none';
                loginView.style.display = 'block';
                loginView.classList.add('active');

            } catch (error) {
                console.error('Logout error:', error.message);
            }
        }

        async function Register(usernameValue, password) {
            try {
                const response = await fetch(`${apiProtocol}://${serverHost}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: usernameValue, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    registerSuccess.classList.add('visible');
                    registerForm.reset();
                    
                    setTimeout(() => {
                        registerSuccess.classList.remove('visible');
                        registerView.style.display = 'none';
                        registerView.classList.remove('active');
                        loginView.style.display = 'block';
                        loginView.classList.add('active');
                        document.getElementById('username-input').value = usernameValue;
                    }, 2000);
                } else {
                    showError(registerError, registerErrorText, data.message || 'Registration failed');
                }
            } catch (error) {
                console.log('Registration error:', error);
                showError(registerError, registerErrorText, 'Connection error. Please try again.');
            }
        }

        async function Login(usernameValue, password) {
            try {
                const response = await fetch(`${apiProtocol}://${serverHost}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: usernameValue, password }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Invalid username or password');
                }

                const data = await response.json();

                token = data.token;
                username = usernameValue;
                shouldReconnect = true;

                loginView.style.display = 'none';
                loginView.classList.remove('active');
                registerView.style.display = 'none';
                document.getElementById('layout').style.display = 'flex';

                connect(token, username);
            } catch (error) {
                showError(loginError, loginErrorText, error.message);
            }
        }

        const setStatus = (connected) => {
            statusDot.classList.toggle("connected", connected);
            statusDot.classList.toggle("disconnected", !connected);
            statusText.textContent = connected ? "Connected" : "Reconnecting";
            messageBox.disabled = !connected;
            sendButton.disabled = !connected;
            chatForm.style.opacity = connected ? 1 : 0.5;
        };

        logout.addEventListener("click", () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                Logout(token);
            }
        });

        function updateUserList(users) {
            userList.innerHTML = "";
            const uniqueUsers = [...new Set(users)];

            uniqueUsers.forEach((user) => {
                if (user !== "Guest") {
                    const li = document.createElement("li");
                    const dot = document.createElement("span");
                    dot.className = "user-dot";
                    li.appendChild(dot);

                    const name = document.createElement("span");
                    name.textContent = user;
                    li.appendChild(name);

                    if (user === username) {
                        li.classList.add("me");
                    }
                    userList.appendChild(li);
                }
            });
        }

        chatForm.addEventListener("submit", (e) => {
            e.preventDefault();
            if (socket && socket.readyState === WebSocket.OPEN && messageBox.value.trim()) {
                const messageObject = {
                    type: "chat",
                    username: username,
                    message: messageBox.value.trim(),
                };
                socket.send(JSON.stringify(messageObject));
                messageBox.value = "";
            } else {
                console.log("Socket is not connected");
            }
        });
    </script>
</body>

</html>
