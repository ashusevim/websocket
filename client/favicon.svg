<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Realtime Chat">
  <!--
    The in-app auth mark (accent tile, speech bubble, three typing dots),
    redrawn for 16px.

    The header version is a 1.8 unit stroke on a 24 grid with 0.4 unit dots.
    Scaled to a tab icon those dots land well under a pixel and vanish, and the
    outline reads as a smudge. So here the bubble is filled and the dots are
    punched out in the tile colour: one solid silhouette, no hairlines, still
    recognisably the same shape at 16px.

    Tile colour is the accent gold rather than a neutral so it holds up on both
    light and dark tab strips instead of disappearing into one of them.
  -->
  <rect width="64" height="64" rx="14" fill="#e3c778" />
  <path transform="translate(5.36 3.58) scale(2.22)" fill="#0a0a0b"
    d="M21 12c0 4.6-4 8.3-9 8.3a9.8 9.8 0 0 1-2.6-.3 6 6 0 0 1-3 1.9 4.5 4.5 0 0 0 1-2 5.7 5.7 0 0 1-.5-1.3A8.3 8.3 0 0 1 3 12c0-4.6 4-8.3 9-8.3s9 3.7 9 8.3Z" />
  <g fill="#e3c778">
    <circle cx="23" cy="30" r="3.2" />
    <circle cx="32" cy="30" r="3.2" />
    <circle cx="41" cy="30" r="3.2" />
  </g>
</svg>
